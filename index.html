<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معرض الصور</title>
<style>
  body {
    margin: 0; padding: 20px;
    background: #0f0f1e;
    background: url('Background.jpg') no-repeat center center fixed;
    background-size: cover; min-height: 100vh;
    font-family: 'Tajawal', sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }
  .card {
    height: 280px; border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    background-size: cover; background-position: center;
    display: flex; align-items: flex-end; justify-content: center;
    color: white; padding-bottom: 15px; font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    transition: all 0.4s ease; cursor: pointer;
  }
  .card:hover { transform: scale(1.03); background-color: rgba(255, 255, 255, 0.2); }
  .loader {
    border: 3px solid rgba(255,255,255,0.3);
    border-top: 3px solid white; border-radius: 50%;
    width: 30px; height: 30px; animation: spin 1s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .lightbox {
    display: none; position: fixed; z-index: 999;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); justify-content: center; align-items: center;
  }
  .lightbox img { max-width: 90%; max-height: 90%; border-radius: 10px; }
</style>
</head>
<body>
<div class="grid" id="app"></div>
<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
  <img id="lightbox-img" src="">
</div>

<script>
const app = document.getElementById('app');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

/* ===== عدّل الـ 3 أشياء هذي فقط ===== */
const userName = 'senanamar2-ui';           // 1. اسم حسابك في GitHub
const repoName = 'senanamar2-ui.github.io'; // 2. اسم الريبو بالضبط
const branch = 'main';                      // 3. اسم البرانش: main أو master
/* ==================================== */

// لو صورك داخل مجلد، حط اسمه هنا. لو في الجذر الرئيسي خليه فاضي ''
const folderName = ''; // مثال: 'عارض الصور' أو 'images'

const baseUrl = `https://raw.githubusercontent.com/${userName}/${repoName}/${branch}/${folderName ? folderName + '/' : ''}`;

// أرقام الصور الموجودة عندك
const imageNumbers = [1, 10, 11, 12, 13, 14, 15, 16, 17, 18]; 

imageNumbers.forEach(num => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<div class="loader"></div>';
  
  const imgUrl = `${baseUrl}${num}.jpg`;
  const img = new Image();
  img.src = imgUrl;
  img.onload = () => {
    card.style.backgroundImage = `url('${imgUrl}')`;
    card.innerHTML = `صورة ${num}`;
    card.onclick = () => {
      lightbox.style.display = 'flex';
      lightboxImg.src = imgUrl;
    };
  };
  img.onerror = () => {
    card.innerHTML = `صورة ${num} غير موجودة<br><small>${imgUrl}</small>`;
    card.style.opacity = '0.6';
    console.log('خطأ في تحميل:', imgUrl);
  };
  app.appendChild(card);
});
</script>
</body>
</html>
