<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الصور الزجاجي</title>
    <style>
        body { 
            margin: 0; 
            padding: 40px; 
            /* خلفية الصفحة */
            background: url('Background.jpg') no-repeat center center fixed; 
            background-size: cover; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 25px; 
        }
        .card { 
            height: 280px; 
            border-radius: 20px; 
            /* تصميم الزجاج */
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            
            /* إعدادات الصورة */
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            color: white;
            padding-bottom: 15px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            background-color: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

<div class="grid" id="app"></div>

<script>
    const app = document.getElementById('app');
    // استبدل 'اسم_المستخدم' و 'اسم_المشروع' بالبيانات الخاصة بك
    const baseUrl = 'https://raw.githubusercontent.com/اسم_المستخدم/اسم_المشروع/main/';

    for (let i = 1; i <= 20; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        
        // جلب الصور من GitHub (تأكد من صيغة الملف jpg أو png)
        card.style.backgroundImage = `url('${baseUrl}${i}.jpg')`;
        
        // إضافة رقم للصورة
        card.innerText = `صورة ${i}`;
        
        app.appendChild(card);
    }
</script>
</body>
</html>
